logFile: "./log.txt"

# Uncomment if you want to use mattermost to notify logs
#mattermost:
#  url: "MATTERMOST_URL"
#  token: "MATTERMOST_TOKEN"

# A list of rules containing country name to block and set name for ipset.
# Every IP in a set is added to the block set. extraIPs are added to the set too,
# so only list addresses here that you want blocked.
# If iptables is defined, iptable rules are created too. Without a policy no rule is added.
rules:
  # Drop packets whose source is in Iran.
  - country: "ir"
    set: "ir-block"
    iptables:
      policy: "drop"
      insert: 1
      type:
        - "src"
      chain: "IPSET_FW"
      table: "raw"

  - country: tor
    set: tor-block
    iptables:
      policy: drop
      insert: 2
      type:
        - "src"

  # Example only: file is a list of network files to combine into one set.
  # Uncomment and point these at real files before use.
